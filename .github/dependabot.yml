version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait a week before proposing a new release; zizmor's dependabot-cooldown audit requires it.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
